<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


    <style>
        canvas {
            display: block;
            border-radius: 28px;
            background: #0f1219;
            width: min(96vw, 96vh);
            height: min(96vw, 96vh);
            max-width: 800px;
            max-height: 800px;
            cursor: crosshair;
        }
    </style>

</head>

<body>
    <canvas id="particleCanvas"></canvas>

    <script>
        (function () {
            const canvas = document.getElementById('particleCanvas');
            const context = canvas.getContext('2D');

            const GRAVITY = 0.18;

            const rand = (min, max) => Math.random() * (max - min) + min;
            let particles = [];

            function spawnParticle() {
                const x = canvas.width / 2 + rand(-45, 45);
                const y = rand(60, 90);

                const radius = rand(2.5, 7.5);

                const vx = rand(-1.2, 1.2);
                const vy = rand(-2.5, 0.2);

                const hue = rand(28, 48);
                const sat = rand(80, 100);
                const light = rand(55, 75);

                const lifetime = rand(70, 180);

                particles.push({ x, y, vx, vy, radius, hue, sat, light, life: lifetime, maxLife: lifetime })
            }
            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];

                    p.vy += GRAVITY;
                    p.x += p.vx;
                    p.y += p.vy;

                    p.vx *= 0.998;
                    p.vy *= 0.998;

                    p.life--

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }

                }
            }

            function draw() {
                context.clearRect(0, 0, canvas.width, canvas.height);

                for (const p of particles) {
                    const color = 'hsla(${p.hue}, ${p.sat}%, ${p.light}%, 0.8)'
                }

                context.beginPath();
                context.aarc(p.x, p.y, p.radius, 0, Math.PI * 2);
                context.fillStyle = color;
                context.fill();
            }

            function loop() {
                for (let s = 0; s < 8; s++) {
                    if (particles.length < 2000) {
                        spawnParticle();
                    }
                }

                updateParticles();

                draw();

                requestAnimationFrame(loop);
            }

            loop();
        })();
    </script>
</body>

</html>
